name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 3. Use --overwrite to ensure the template files (lib/main.dart) are created
      - name: Create or Repair Flutter Project
        run: |
          flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          
          # This will confirm the file exists in the logs
          ls -R lib/

      - name: Install dependencies
        run: flutter pub get

      # 4. Build the Release APK (Much smaller and faster)
      - name: Build APK
        run: flutter build apk --release

      # 5. Update the path for the release artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release-apk
          # Path changes from flutter-apk/app-debug.apk to app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk