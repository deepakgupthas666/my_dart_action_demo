name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 3. Force create the project files. 
      # This overwrites any existing pubspec/folders to ensure lib/main.dart exists.
      - name: Create or Repair Flutter Project
        run: |
          flutter create . --project-name=my_dart_action_demo --platforms=android --force
          
          # This command will show us in the logs if lib/main.dart actually exists
          ls -R lib/

      - name: Install dependencies
        run: flutter pub get

      # 4. Build the actual APK
      - name: Build APK
        run: flutter build apk --debug

      # 5. Correct the path for the artifact upload
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          # Standard Flutter output doesn't usually include the project name in the filename
          path: build/app/outputs/flutter-apk/app-debug.apk