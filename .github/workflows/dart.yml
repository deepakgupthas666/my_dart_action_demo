name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 3. Use --overwrite to ensure the template files (lib/main.dart) are created
      # - name: Create or Repair Flutter Project
      #   run: |
      #     flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          
      #     # This will confirm the file exists in the logs
      #     ls -R lib/
      - name: Inject Flutter Infrastructure
        run: |
          # 1. Create a temporary project in a subfolder
          flutter create --project-name=my_dart_action_demo --platforms=android temp_project
          
          # 2. Move the required infrastructure files to the root, 
          # but DO NOT move the 'lib' folder (preserving your code)
          cp -rn temp_project/android .
          cp -n temp_project/pubspec.yaml .
          cp -n temp_project/analysis_options.yaml .
          
          # 3. Clean up the temporary folder
          rm -rf temp_project
          
          # 4. Final check: Ensure lib/ exists (if repo was truly empty)
          if [ ! -d lib ]; then
            mkdir lib
            echo "import 'package:flutter/material.dart'; void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('Manual Code Success')))));" > lib/main.dart
          fi      


      # 4. Build the Release APK (Much smaller and faster)
      - name: Build APK
        run: flutter build apk --release

      # 5. Update the path for the release artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release-apk
          # Path changes from flutter-apk/app-debug.apk to app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk