name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 3. Use --overwrite to ensure the template files (lib/main.dart) are created
      # - name: Create or Repair Flutter Project
      #   run: |
      #     flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          
      #     # This will confirm the file exists in the logs
      #     ls -R lib/
      - name: Prepare Build Shell
        run: |
          # 1. Create a "blank" project in a temp folder
          flutter create --project-name=engine --platforms=android _build_shell
          
          # 2. Delete the temp project's 'lib' folder
          rm -rf _build_shell/lib
          
          # 3. Copy YOUR 'lib' folder from the repo into the shell
          # This ensures YOUR code is what gets built.
          cp -r lib _build_shell/lib
          
          # 4. Copy YOUR pubspec if you have one, otherwise use the engine's
          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml _build_shell/pubspec.yaml
          fi

      - name: Build APK
        # We run the build INSIDE the shell where your code now lives
        working-directory: _build_shell
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: _build_shell/build/app/outputs/flutter-apk/app-release.apk