name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Flutter app
        # Use the pipe "|" to run multiple commands in one step
        run: |
          # 1. Prepare the Dart entry point
          mkdir -p lib
          cp bin/my_dart_action_demo.dart lib/main.dart
          
          # 2. DELETE any existing/broken android folder
          rm -rf android
          
          # 3. FORCE Flutter to create the missing Android infrastructure
          # This creates the Gradle files the builder is complaining about
          flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          
          # 4. Standard build sequence
          flutter pub get
          dart format .
          flutter build apk --release

      - name: Upload APK
        # This MUST be a separate step starting with "uses"
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # Updated path for modern Flutter versions
          path: build/app/outputs/flutter-apk/app-release.apk