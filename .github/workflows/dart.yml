name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # distribution: 'zulu'
          java-version: '12.x'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Flutter app
        # Use the pipe "|" to run multiple commands in one step
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze .
          flutter build apk --release

      - name: Upload APK
        # This MUST be a separate step starting with "uses"
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # Updated path for modern Flutter versions
          path: build/app/outputs/flutter-apk/app-release.apk