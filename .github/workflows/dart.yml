name: Flutter APK Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. APKs require Java (the Android build toolchain needs it)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up Flutter (includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 3. Use --overwrite to ensure the template files (lib/main.dart) are created
      # - name: Create or Repair Flutter Project
      #   run: |
      #     flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          
      #     # This will confirm the file exists in the logs
      #     ls -R lib/
      # 3. Ensure the source code actually exists before building
      - name: Ensure lib/main.dart exists
        run: |
          # If the directory doesn't exist, create it
          mkdir -p lib
          
          # If main.dart is missing, create a basic "Hello World"
          if [ ! -f lib/main.dart ]; then
            cat <<EOF > lib/main.dart
            import 'package:flutter/material.dart';

            void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text('Hello World')))));
            EOF
          fi

          # If pubspec is missing, create the project structure
          if [ ! -f pubspec.yaml ]; then
            flutter create --project-name=my_dart_action_demo --platforms=android --overwrite .
          fi
          
          # Debug: List the files so we can see them in the logs
          ls -R lib/

      # 4. Build the Release APK (Much smaller and faster)
      - name: Build APK
        run: flutter build apk --release

      # 5. Update the path for the release artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release-apk
          # Path changes from flutter-apk/app-debug.apk to app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk